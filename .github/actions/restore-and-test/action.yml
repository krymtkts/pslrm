name: Restore and test
description: Restore PSGallery dependencies and execute the full test suite.

inputs:
  shell:
    description: Shell used to execute restore and test commands.
    required: true
  disable-coverage:
    description: Whether to disable code coverage collection.
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Prepare Microsoft.PowerShell.PSResourceGet for Windows PowerShell
      shell: ${{ inputs.shell }}
      if: inputs.shell == 'powershell'
      run: |
        Install-Module -Name Microsoft.PowerShell.PSResourceGet -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck
    - name: Prepare PSResourceRepository
      # NOTE: This is a workaround for PSResourceGet failing to load the repository store, which causes the following error:
      # Cannot retrieve the dynamic parameters for the cmdlet. Loading
      # repository store failed: Could not find a part of the path
      # '/home/runner/.local/share/PSResourceGet/PSResourceRepository.xml'.
      shell: ${{ inputs.shell }}
      run: |
        Get-PSResourceRepository -Name PSGallery
        Set-PSResourceRepository -Name PSGallery -Trusted -ApiVersion V2
    - name: Restore modules from PSGallery
      shell: ${{ inputs.shell }}
      run: |
        Import-Module ./pslrm.psd1 -Force
        Restore-PSLResource
    - name: Execute All Tests
      shell: ${{ inputs.shell }}
      env:
        DISABLE_COVERAGE: ${{ inputs.disable-coverage }}
      run: |
        $Params = @{
            Tasks = 'TestAll'
        }
        if ($env:DISABLE_COVERAGE -eq 'true') {
            $Params['DisableCoverage'] = $true
        }
        & ./.build.ps1 @Params
